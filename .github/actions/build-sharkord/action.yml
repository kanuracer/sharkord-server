name: Build Sharkord
description: Install Bun dependencies and build server artifacts. Requires checkout before use.

inputs:
  bun_version:
    description: Bun version to install
    required: false
    default: 1.4.4
  bump:
    description: Version bump mode (none, patch, minor, major)
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Install Node for build tools
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4

    - name: Install Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ inputs.bun_version }}

    - name: Install dependencies
      shell: bash
      run: |
        bun -e 'if (Bun.semver.order(Bun.version, "1.4.4") < 0) throw new Error("Bun 1.4.4 or newer is required")'
        bun install --frozen-lockfile

    - name: Build app
      shell: bash
      run: |
        cd apps/server
        bun run build --bump "${{ inputs.bump }}"
